<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports | Jira Lite / Sprint Manager</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-kicker">Portfolio Metrics</p>
            <h1 class="page-title">Reports</h1>
            <p class="page-description">
              Summarize sprint delivery, workload distribution, priority mix,
              ownership, and velocity.
            </p>
          </div>
          <button class="btn btn-cyber" id="exportReportBtn" type="button">
            <i class="bi bi-download me-1"></i>Export Report
          </button>
        </header>

        <section class="grid-auto mb-3" id="reportCards"></section>

        <section class="grid-two mb-3">
          <div class="panel">
            <h2 class="section-title">Work by Status</h2>
            <div id="statusReport"></div>
          </div>

          <div class="panel">
            <h2 class="section-title">Work by Priority</h2>
            <div id="priorityReport"></div>
          </div>
        </section>

        <section class="panel">
          <div
            class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-wrap"
          >
            <div>
              <h2 class="section-title mb-1">Work by Assignee</h2>
              <p class="text-muted-custom mb-0">
                Track how tasks and points are distributed across the team.
              </p>
            </div>
          </div>
          <div id="assigneeReport"></div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/reports.js"></script>
  </body>
</html>
