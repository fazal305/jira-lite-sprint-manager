<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team | Jira Lite / Sprint Manager</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-kicker">Team Capacity</p>
            <h1 class="page-title">Team Members</h1>
            <p class="page-description">
              Manage Agile team members and track assigned tasks, completed
              work, and story point ownership.
            </p>
          </div>
        </header>

        <section class="form-panel mb-3">
          <h2 class="section-title">Add or Edit Team Member</h2>
          <form id="teamForm">
            <input type="hidden" id="memberId" />

            <div class="row g-3">
              <div class="col-lg-4">
                <label class="form-label" for="memberName">Name</label>
                <input
                  class="form-control"
                  id="memberName"
                  required
                  placeholder="Fazal Abbas"
                />
              </div>
              <div class="col-lg-4">
                <label class="form-label" for="memberRole">Role</label>
                <input
                  class="form-control"
                  id="memberRole"
                  required
                  placeholder="Frontend Developer"
                />
              </div>
              <div class="col-lg-2">
                <label class="form-label" for="memberInitials">Initials</label>
                <input
                  class="form-control"
                  id="memberInitials"
                  maxlength="3"
                  placeholder="FA"
                />
              </div>
              <div class="col-lg-2 d-flex align-items-end">
                <button class="btn btn-cyber w-100" type="submit">
                  <i class="bi bi-save me-1"></i>Save
                </button>
              </div>
            </div>

            <button
              class="btn btn-soft mt-3"
              id="cancelMemberEditBtn"
              type="button"
            >
              <i class="bi bi-x-circle me-1"></i>Clear Form
            </button>
          </form>
        </section>

        <section class="grid-auto mb-3" id="teamStats"></section>

        <section class="panel">
          <div
            class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-wrap"
          >
            <div>
              <h2 class="section-title mb-1">Roster</h2>
              <p class="text-muted-custom mb-0">
                Each member card summarizes current workload and completed
                delivery.
              </p>
            </div>
          </div>

          <div class="row g-3" id="teamMembers"></div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/team.js"></script>
  </body>
</html>
