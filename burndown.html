<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burndown | Jira Lite / Sprint Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="sidebarMount"></div>

    <div class="app-shell">
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-kicker">Sprint Analytics</p>
            <h1 class="page-title">Burndown Chart</h1>
            <p class="page-description">
              Compare ideal sprint burn with actual completed story points
              across the sprint timeline.
            </p>
          </div>
        </header>

        <section class="panel mb-3">
          <div class="row g-3 align-items-end">
            <div class="col-lg-5">
              <label class="form-label" for="sprintSelector">Sprint</label>
              <select class="form-select" id="sprintSelector"></select>
            </div>
            <div class="col-lg-7">
              <div class="grid-auto" id="burndownStats"></div>
            </div>
          </div>
        </section>

        <section class="chart-panel">
          <div
            class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-wrap"
          >
            <div>
              <h2 class="section-title mb-1">Remaining Story Points</h2>
              <p class="text-muted-custom mb-0" id="chartCaption">
                Select a sprint to render the burndown chart.
              </p>
            </div>
            <span class="story-pill" id="chartTotalPoints">0 pts</span>
          </div>

          <div class="chart-wrap">
            <canvas id="burndownCanvas"></canvas>
          </div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/burndown.js"></script>
  </body>
</html>
