<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings | Jira Lite / Sprint Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="sidebarMount"></div>

    <div class="app-shell">
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-kicker">Workspace Control</p>
            <h1 class="page-title">Settings</h1>
            <p class="page-description">
              Manage theme preference, reset demo data, export or import the
              full workspace, and clear localStorage.
            </p>
          </div>
        </header>

        <section class="grid-two">
          <div class="panel">
            <h2 class="section-title">Appearance</h2>
            <div class="activity-item">
              <div
                class="d-flex justify-content-between align-items-center gap-3 flex-wrap"
              >
                <div>
                  <strong>Dark Mode</strong>
                  <p class="text-muted-custom mb-0">
                    Switch between the dark Agile dashboard and light workspace
                    theme.
                  </p>
                </div>
                <div class="form-check form-switch fs-4">
                  <input
                    class="form-check-input"
                    id="darkModeToggle"
                    type="checkbox"
                    role="switch"
                  />
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <h2 class="section-title">Workspace Data</h2>
            <div class="d-grid gap-2">
              <button
                class="btn btn-cyber"
                id="exportWorkspaceBtn"
                type="button"
              >
                <i class="bi bi-download me-1"></i>Export Full Workspace JSON
              </button>

              <label class="btn btn-soft mb-0" for="importWorkspaceInput">
                <i class="bi bi-upload me-1"></i>Import Workspace JSON
              </label>
              <input
                class="d-none"
                id="importWorkspaceInput"
                type="file"
                accept="application/json"
              />

              <button class="btn btn-soft" id="resetDemoBtn" type="button">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Demo Data
              </button>

              <button
                class="btn btn-danger-soft"
                id="clearWorkspaceBtn"
                type="button"
              >
                <i class="bi bi-trash me-1"></i>Clear localStorage
              </button>
            </div>
          </div>

          <div class="panel">
            <h2 class="section-title">Current Workspace</h2>
            <ul class="compact-list" id="workspaceSummary"></ul>

            <div class="divider"></div>

            <h2 class="section-title">Storage Key</h2>
            <div class="activity-item">
              <p class="mono mb-2">jiraLiteWorkspace</p>
              <button
                class="btn btn-sm btn-soft"
                id="copyStorageKeyBtn"
                type="button"
              >
                <i class="bi bi-clipboard me-1"></i>Copy Key
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
