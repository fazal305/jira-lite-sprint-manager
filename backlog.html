<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backlog | Jira Lite / Sprint Manager</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="page-kicker">Product Backlog</p>
            <h1 class="page-title">Backlog Refinement</h1>
            <p class="page-description">
              Create, estimate, assign, search, and move work items into sprint
              scope.
            </p>
          </div>
        </header>

        <section class="form-panel mb-3">
          <h2 class="section-title">Add or Edit Backlog Item</h2>
          <form id="backlogForm">
            <input type="hidden" id="itemId" />

            <div class="row g-3">
              <div class="col-lg-6">
                <label class="form-label" for="itemTitle">Title</label>
                <input
                  class="form-control"
                  id="itemTitle"
                  required
                  placeholder="Build login page"
                />
              </div>
              <div class="col-lg-3">
                <label class="form-label" for="itemType">Type</label>
                <select class="form-select" id="itemType">
                  <option>Story</option>
                  <option>Bug</option>
                  <option>Task</option>
                  <option>Epic</option>
                </select>
              </div>
              <div class="col-lg-3">
                <label class="form-label" for="itemPriority">Priority</label>
                <select class="form-select" id="itemPriority">
                  <option>Low</option>
                  <option selected>Medium</option>
                  <option>High</option>
                  <option>Critical</option>
                </select>
              </div>
              <div class="col-lg-6">
                <label class="form-label" for="itemDescription"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="itemDescription"
                  placeholder="Describe the work item"
                ></textarea>
              </div>
              <div class="col-lg-2">
                <label class="form-label" for="itemStoryPoints"
                  >Story Points</label
                >
                <select class="form-select" id="itemStoryPoints">
                  <option>1</option>
                  <option>2</option>
                  <option selected>3</option>
                  <option>5</option>
                  <option>8</option>
                  <option>13</option>
                </select>
              </div>
              <div class="col-lg-2">
                <label class="form-label" for="itemStatus">Status</label>
                <select class="form-select" id="itemStatus">
                  <option>To Do</option>
                  <option>In Progress</option>
                  <option>Review</option>
                  <option>Done</option>
                </select>
              </div>
              <div class="col-lg-2">
                <label class="form-label" for="itemAssignee">Assignee</label>
                <select class="form-select" id="itemAssignee"></select>
              </div>
            </div>

            <div class="d-flex gap-2 mt-3 flex-wrap">
              <button class="btn btn-cyber" type="submit">
                <i class="bi bi-save me-1"></i>Save Item
              </button>
              <button class="btn btn-soft" id="cancelEditBtn" type="button">
                <i class="bi bi-x-circle me-1"></i>Clear Form
              </button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div
            class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-wrap"
          >
            <div>
              <h2 class="section-title mb-1">Backlog Items</h2>
              <p class="text-muted-custom mb-0">
                Filter the workspace and move ready work into a sprint.
              </p>
            </div>
            <span class="story-pill" id="backlogPointTotal">0 pts</span>
          </div>

          <div class="filters-bar">
            <input
              class="form-control"
              id="searchInput"
              placeholder="Search title or description"
            />
            <select class="form-select" id="typeFilter">
              <option value="">All types</option>
              <option>Story</option>
              <option>Bug</option>
              <option>Task</option>
              <option>Epic</option>
            </select>
            <select class="form-select" id="priorityFilter">
              <option value="">All priorities</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Critical</option>
            </select>
            <select class="form-select" id="assigneeFilter"></select>
            <select class="form-select" id="statusFilter">
              <option value="">All statuses</option>
              <option>To Do</option>
              <option>In Progress</option>
              <option>Review</option>
              <option>Done</option>
            </select>
          </div>

          <div id="backlogList"></div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/backlog.js"></script>
  </body>
</html>
